name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install CJK fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fonts-wqy-microhei

      - name: Download Godot
        run: |
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64

      - name: Import project
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --import

      - name: Unit tests
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/run_tests.gd

      - name: Smoke test
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --fixed-fps 60 --script res://tools/smoke.gd
